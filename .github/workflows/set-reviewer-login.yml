name: Set Play reviewer login

# Run by hand (Actions -> "Set Play reviewer login" -> Run workflow). Uses the same server key as the deploy job to put the two
# REVIEW_ACCOUNT_* settings in the backend's settings file, restarts the backend, and checks it is healthy. If the check fails, the
# old settings file is put back. The code is masked in the log. Keep the settings in place permanently: Google reviews every update.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Reviewer email (for example playreview@shreerammilk.com)
        required: true
      code:
        description: Reviewer 6-digit code (not 123456)
        required: true

concurrency:
  group: shreeram-backend-deploy
  cancel-in-progress: false

jobs:
  set-reviewer-login:
    runs-on: ubuntu-latest

    steps:
      - name: Check the inputs
        env:
          EMAIL: ${{ inputs.email }}
          CODE: ${{ inputs.code }}
        run: |
          echo "::add-mask::$CODE"
          printf '%s' "$EMAIL" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$' || { echo "The email does not look right."; exit 1; }
          printf '%s' "$CODE" | grep -Eq '^[0-9]{6}$' || { echo "The code must be exactly 6 digits."; exit 1; }
          [ "$CODE" != "123456" ] || { echo "Choose a code other than 123456."; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Put the settings on the server and restart the backend
        env:
          EMAIL: ${{ inputs.email }}
          CODE: ${{ inputs.code }}
        run: |
          cat > remote.sh <<'REMOTE'
          set -eu
          # Where the backend reads its settings: the service's EnvironmentFile, or the .env next to the code.
          FILE=$(systemctl cat shreeram-backend 2>/dev/null | sed -n 's/^EnvironmentFile=-\{0,1\}//p' | head -1)
          FILE=${FILE:-/var/www/html/shreeram-backend/.env}
          test -f "$FILE" || { echo "Settings file not found: $FILE"; exit 1; }
          echo "Using settings file: $FILE"
          sudo cp -p "$FILE" "$FILE.backup-reviewer"
          sudo sed -i '/^REVIEW_ACCOUNT_/d' "$FILE"
          printf 'REVIEW_ACCOUNT_EMAIL=%s\nREVIEW_ACCOUNT_CODE=%s\n' "$EMAIL" "$CODE" | sudo tee -a "$FILE" > /dev/null
          sudo systemctl restart shreeram-backend
          sleep 4
          if sudo systemctl is-active --quiet shreeram-backend && curl --fail --silent --show-error http://127.0.0.1:4000/health; then
            echo
            echo "Done: the reviewer login is set and the backend is healthy."
          else
            echo "The backend did not come back healthy. Putting the old settings back."
            sudo cp -p "$FILE.backup-reviewer" "$FILE"
            sudo systemctl restart shreeram-backend
            exit 1
          fi
          REMOTE
          # The email and code go first on standard input (so they never appear in a command line on the server), then the script.
          { printf '%s\n%s\n' "$EMAIL" "$CODE"; cat remote.sh; } | ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'IFS= read -r EMAIL; IFS= read -r CODE; export EMAIL CODE; bash -s'
