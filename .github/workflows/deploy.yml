
name: Deploy ShreeRam Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shreeram-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend source
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/shreeram-backend/"

      - name: Build and restart backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'set -e
             cd /var/www/html/shreeram-backend
             npm ci
             npm run build
             sudo systemctl restart shreeram-backend
             sleep 3
             sudo systemctl is-active --quiet shreeram-backend
             curl --fail --silent --show-error http://127.0.0.1:4000/health'
