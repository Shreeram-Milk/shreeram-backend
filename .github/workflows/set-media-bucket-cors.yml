name: Allow the admin site to upload pictures

# Run by hand (Actions -> "Allow the admin site to upload pictures" -> Run workflow). The admin site sends pictures straight from the
# browser to the media bucket, and the bucket must list that site as allowed. This adds the site to the bucket's CORS list, keeping
# every rule already there. It uses the AWS access the backend itself already has on the server, so it needs no AWS login. If that
# access is not allowed to change bucket settings, the job says so and nothing is changed.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: The site that uploads pictures
        required: true
        default: https://admin.shreerammilk.com

concurrency:
  group: shreeram-backend-deploy
  cancel-in-progress: false

jobs:
  allow-uploads:
    runs-on: ubuntu-latest

    steps:
      - name: Check the input
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          printf '%s' "$ORIGIN" | grep -Eq '^https://[a-z0-9.-]+$' || { echo "The site must look like https://admin.example.com (https, no path, no slash at the end)."; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Add the site to the bucket's allowed list
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          cat > remote.sh <<'REMOTE'
          set -eu
          FILE=$(systemctl cat shreeram-backend 2>/dev/null | sed -n 's/^EnvironmentFile=-\{0,1\}//p' | head -1)
          FILE=${FILE:-/var/www/html/shreeram-backend/.env}
          test -f "$FILE" || { echo "Settings file not found: $FILE"; exit 1; }
          cd /var/www/html/shreeram-backend
          cat > cors-update.mjs <<'JS'
          import { GetBucketCorsCommand, PutBucketCorsCommand, S3Client } from '@aws-sdk/client-s3'
          const bucket = process.env.S3_MEDIA_BUCKET
          const region = process.env.AWS_REGION
          const origin = process.env.ORIGIN
          if (!bucket || !region) { console.log('The backend has no media bucket or region set.'); process.exit(1) }
          const client = new S3Client({ region })
          let rules = []
          try {
            rules = (await client.send(new GetBucketCorsCommand({ Bucket: bucket }))).CORSRules ?? []
          } catch (error) {
            if (error.name !== 'NoSuchCORSConfiguration') {
              console.log('Could not read the bucket settings (' + error.name + '). Nothing was changed. The server\'s AWS access is not allowed to manage the bucket: ask DevOps to add the site in the AWS console (S3 > the bucket > Permissions > CORS).')
              process.exit(2)
            }
          }
          if (rules.some(rule => rule.AllowedOrigins?.includes(origin) && rule.AllowedMethods?.includes('PUT'))) { console.log('Already allowed: ' + origin); process.exit(0) }
          const wanted = { AllowedOrigins: [origin], AllowedMethods: ['GET', 'PUT', 'HEAD'], AllowedHeaders: ['content-type'], ExposeHeaders: ['ETag'], MaxAgeSeconds: 3000 }
          try {
            await client.send(new PutBucketCorsCommand({ Bucket: bucket, CORSConfiguration: { CORSRules: [...rules, wanted] } }))
          } catch (error) {
            console.log('Could not change the bucket settings (' + error.name + '). Nothing was changed. Ask DevOps to add the site in the AWS console (S3 > the bucket > Permissions > CORS).')
            process.exit(2)
          }
          console.log('Added ' + origin + ' to the bucket (' + rules.length + ' existing rule(s) kept).')
          JS
          node --env-file="$FILE" cors-update.mjs
          rm -f cors-update.mjs
          REMOTE
          { printf '%s\n' "$ORIGIN"; cat remote.sh; } | ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'IFS= read -r ORIGIN; export ORIGIN; bash -s'

      - name: Check it worked
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          # Ask the bucket the same question the browser asks before uploading.
          URL="https://shreeram-media-dev.s3.ap-south-1.amazonaws.com/products/cors-check.webp"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$URL" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: PUT" -H "Access-Control-Request-Headers: content-type")
            echo "Preflight attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && { echo "Done: the admin site may now upload pictures."; exit 0; }
            sleep 6
          done
          echo "The bucket still refuses the site. Check the job above."
          exit 1
