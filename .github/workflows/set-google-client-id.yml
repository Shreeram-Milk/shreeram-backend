name: Set Google sign-in client id

# Run by hand (Actions -> "Set Google sign-in client id" -> Run workflow). Puts GOOGLE_WEB_CLIENT_ID (the Google web client id of the
# app, a public identifier and not a secret) in the backend's settings file, restarts the backend, and checks it is healthy. If the
# check fails, the old settings file is put back. Needed once for "Continue with Google"; the backend checks every Google sign-in
# token against it.

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: Google web client id (looks like 123456789012-abc123.apps.googleusercontent.com)
        required: true

concurrency:
  group: shreeram-backend-deploy
  cancel-in-progress: false

jobs:
  set-google-client-id:
    runs-on: ubuntu-latest

    steps:
      - name: Check the input
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          printf '%s' "$CLIENT_ID" | grep -Eq '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$' || { echo "That does not look like a Google client id."; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Put the setting on the server and restart the backend
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          cat > remote.sh <<'REMOTE'
          set -eu
          # Where the backend reads its settings: the service's EnvironmentFile, or the .env next to the code.
          FILE=$(systemctl cat shreeram-backend 2>/dev/null | sed -n 's/^EnvironmentFile=-\{0,1\}//p' | head -1)
          FILE=${FILE:-/var/www/html/shreeram-backend/.env}
          test -f "$FILE" || { echo "Settings file not found: $FILE"; exit 1; }
          echo "Using settings file: $FILE"
          sudo cp -p "$FILE" "$FILE.backup-google"
          sudo sed -i '/^GOOGLE_WEB_CLIENT_ID=/d' "$FILE"
          printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$CLIENT_ID" | sudo tee -a "$FILE" > /dev/null
          sudo systemctl restart shreeram-backend
          sleep 4
          if sudo systemctl is-active --quiet shreeram-backend && curl --fail --silent --show-error http://127.0.0.1:4000/health; then
            echo
            echo "Done: Google sign-in is switched on and the backend is healthy."
          else
            echo "The backend did not come back healthy. Putting the old settings back."
            sudo cp -p "$FILE.backup-google" "$FILE"
            sudo systemctl restart shreeram-backend
            exit 1
          fi
          REMOTE
          { printf '%s\n' "$CLIENT_ID"; cat remote.sh; } | ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'IFS= read -r CLIENT_ID; export CLIENT_ID; bash -s'
